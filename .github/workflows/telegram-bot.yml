name: Sana (Master Manager)

on:
  schedule:
    # Har 6 ghante naya live session — beech mein Liva CONTINUOUS chalti hai
    # (long-polling = replies almost instant). Public repo = unlimited minutes.
    - cron: "5 0 * * *"
    - cron: "5 6 * * *"
    - cron: "5 12 * * *"
    - cron: "5 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liva-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # GitHub max 6h — thoda pehle band, agla session le lega
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Liva LIVE — Ram ke messages sun rahi hai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          LINKEDIN_TOKEN_EXPIRY: ${{ secrets.LINKEDIN_TOKEN_EXPIRY }}
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python telegram_bot.py

      - name: Commit memory + offset
        run: |
          git config user.name "liva-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/
          if git diff --cached --quiet; then
            echo "Kuch naya nahi"
          else
            git commit -m "sana: memory sync [skip ci]"
            git pull --rebase --autostash || true
            git push || true
          fi
